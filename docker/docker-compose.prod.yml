name: mnemis-prod

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mnemis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-mnemis}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mnemis} -d ${POSTGRES_DB:-mnemis}']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mnemis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mnemis}
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:?INTERNAL_AUTH_SECRET is required}
      API_HOST: 0.0.0.0
      API_PORT: '8787'
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MNEMIS_VERSION: ${MNEMIS_VERSION:-}
      MNEMIS_MODE: ${MNEMIS_MODE:-self-host}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MNEMIS_CONTEXTUAL_PREFIX_CONCURRENCY: ${MNEMIS_CONTEXTUAL_PREFIX_CONCURRENCY:-4}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      FIRECRAWL_API_URL: ${FIRECRAWL_API_URL:-https://api.firecrawl.dev/v2}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      MNEMIS_TAVILY_API_KEY: ${MNEMIS_TAVILY_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      MNEMIS_EXA_API_KEY: ${MNEMIS_EXA_API_KEY:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      MNEMIS_BRAVE_SEARCH_API_KEY: ${MNEMIS_BRAVE_SEARCH_API_KEY:-}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      OPENALEX_EMAIL: ${OPENALEX_EMAIL:-}
      MNEMIS_RESEARCH_TIMEOUT_MS: ${MNEMIS_RESEARCH_TIMEOUT_MS:-20000}
      MNEMIS_PDF_EXTRACTOR_URL: ${MNEMIS_PDF_EXTRACTOR_URL:-}
      MNEMIS_PDF_EXTRACTOR_TIMEOUT_MS: ${MNEMIS_PDF_EXTRACTOR_TIMEOUT_MS:-180000}
      MNEMIS_PDF_NATIVE_MIN_CHARS: ${MNEMIS_PDF_NATIVE_MIN_CHARS:-1500}
      MNEMIS_RERANK_PROVIDER: ${MNEMIS_RERANK_PROVIDER:-}
      MNEMIS_RERANK_MODEL: ${MNEMIS_RERANK_MODEL:-}
      MNEMIS_LOCAL_RERANK_MODEL: ${MNEMIS_LOCAL_RERANK_MODEL:-}
      ANTHROPIC_CONTEXT_MODEL: ${ANTHROPIC_CONTEXT_MODEL:-}
      MNEMIS_PROVIDER_TIMEOUT_MS: ${MNEMIS_PROVIDER_TIMEOUT_MS:-30000}
      MNEMIS_MAX_BODY_BYTES: ${MNEMIS_MAX_BODY_BYTES:-}
      MNEMIS_RATE_LIMIT_PER_MINUTE: ${MNEMIS_RATE_LIMIT_PER_MINUTE:-}
      MNEMIS_RATE_LIMIT_BACKEND: ${MNEMIS_RATE_LIMIT_BACKEND:-}
      MNEMIS_TRUST_PROXY: ${MNEMIS_TRUST_PROXY:-false}
    ports:
      - '${API_PORT:-8787}:8787'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8787/health > /dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 4

  migrate:
    profiles: ['tools']
    build:
      context: ..
      dockerfile: docker/Dockerfile.migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mnemis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mnemis}
    restart: 'no'

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mnemis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mnemis}
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MNEMIS_VERSION: ${MNEMIS_VERSION:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MNEMIS_CONTEXTUAL_PREFIX_CONCURRENCY: ${MNEMIS_CONTEXTUAL_PREFIX_CONCURRENCY:-4}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      FIRECRAWL_API_URL: ${FIRECRAWL_API_URL:-https://api.firecrawl.dev/v2}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      MNEMIS_TAVILY_API_KEY: ${MNEMIS_TAVILY_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      MNEMIS_EXA_API_KEY: ${MNEMIS_EXA_API_KEY:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      MNEMIS_BRAVE_SEARCH_API_KEY: ${MNEMIS_BRAVE_SEARCH_API_KEY:-}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      OPENALEX_EMAIL: ${OPENALEX_EMAIL:-}
      MNEMIS_RESEARCH_TIMEOUT_MS: ${MNEMIS_RESEARCH_TIMEOUT_MS:-20000}
      MNEMIS_PDF_EXTRACTOR_URL: ${MNEMIS_PDF_EXTRACTOR_URL:-}
      MNEMIS_PDF_EXTRACTOR_TIMEOUT_MS: ${MNEMIS_PDF_EXTRACTOR_TIMEOUT_MS:-180000}
      MNEMIS_PDF_NATIVE_MIN_CHARS: ${MNEMIS_PDF_NATIVE_MIN_CHARS:-1500}
      MNEMIS_MODE: ${MNEMIS_MODE:-self-host}
      MNEMIS_ALLOW_LOCAL_SOURCES: ${MNEMIS_ALLOW_LOCAL_SOURCES:-false}
      MNEMIS_LOCAL_SOURCE_ROOTS: ${MNEMIS_LOCAL_SOURCE_ROOTS:-}
      MNEMIS_RERANK_PROVIDER: ${MNEMIS_RERANK_PROVIDER:-}
      MNEMIS_RERANK_MODEL: ${MNEMIS_RERANK_MODEL:-}
      MNEMIS_LOCAL_RERANK_MODEL: ${MNEMIS_LOCAL_RERANK_MODEL:-}
      ANTHROPIC_CONTEXT_MODEL: ${ANTHROPIC_CONTEXT_MODEL:-}
      MNEMIS_PROVIDER_TIMEOUT_MS: ${MNEMIS_PROVIDER_TIMEOUT_MS:-30000}
      MNEMIS_FETCH_TIMEOUT_MS: ${MNEMIS_FETCH_TIMEOUT_MS:-15000}
      MNEMIS_GIT_TIMEOUT_MS: ${MNEMIS_GIT_TIMEOUT_MS:-300000}
      JOB_STALE_AFTER_MS: ${JOB_STALE_AFTER_MS:-1800000}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1000}
      WORKER_ONCE: ${WORKER_ONCE:-false}

  grobid:
    image: ${GROBID_IMAGE:-grobid/grobid:0.9.0-crf}
    profiles: ['pdf']
    restart: always
    init: true
    ulimits:
      core: 0

  pdf-extractor:
    build:
      context: ..
      dockerfile: services/pdf-extractor/Dockerfile
    profiles: ['pdf']
    restart: always
    depends_on:
      - grobid
    environment:
      PDF_EXTRACTOR_MAX_BYTES: ${PDF_EXTRACTOR_MAX_BYTES:-52428800}
      PDF_EXTRACTOR_ENABLE_GROBID: ${PDF_EXTRACTOR_ENABLE_GROBID:-true}
      PDF_EXTRACTOR_GROBID_URL: ${PDF_EXTRACTOR_GROBID_URL:-http://grobid:8070}
      PDF_EXTRACTOR_GROBID_TIMEOUT_SECONDS: ${PDF_EXTRACTOR_GROBID_TIMEOUT_SECONDS:-120}

volumes:
  postgres-data:
