name: mnemis

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mnemis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mnemis
      POSTGRES_PASSWORD: mnemis_dev
      POSTGRES_DB: mnemis
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mnemis -d mnemis']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
