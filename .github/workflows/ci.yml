name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mnemis
          POSTGRES_PASSWORD: mnemis_dev
          POSTGRES_DB: mnemis
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U mnemis -d mnemis"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DATABASE_URL: postgres://mnemis:mnemis_dev@localhost:5432/mnemis
      INTERNAL_AUTH_SECRET: ci-secret-not-real
      MNEMIS_ALLOW_LOCAL_SOURCES: 'true'
      STRIPE_PRICE_BUILDER: price_ci_builder
      STRIPE_PRICE_TEAM: price_ci_team
      STRIPE_PRICE_BUSINESS: price_ci_business
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.1'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Push schema to test DB
        run: bun run db:push:ci

      - name: Seed test plans
        run: bun --filter @mnemis/db seed:plans

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
